# Cropped LuST scenario around Luxembourg city centre (Place d'Armes),
# morning peak. Procedure: src/trafficmarl/scenarios/lust.py; figure of the
# selected area: docs/figures/lust_crop.png.
scenario:
  name: lust
  kind: lust
  output_dir: networks/lust/lust_center
  figure: docs/figures/lust_crop.png
  source:
    dir: external/LuSTScenario/scenario
    net_file: lust.net.xml
    tls_static_file: tll.static.xml     # LuST fixed-time programs (active by default)
    vtypes_file: vtypes.add.xml
    # Dynamic-user-equilibrium routes computed by LuST for its static programs.
    # The shortest-path DUA routes were tried first: they push every driver onto
    # the same boulevard and the crop gridlocks even at 0.6x demand under both
    # static and actuated control (mean waiting > 280 s), see docs/scenarios.md.
    # transit = through traffic. Bus lines are left out (they need the full
    # bus-stop infrastructure).
    route_files:
      - DUERoutes/local.static.0.rou.xml
      - DUERoutes/local.static.1.rou.xml
      - DUERoutes/local.static.2.rou.xml
      - transit.rou.xml
  crop:
    center_lat: 49.6113                 # Place d'Armes
    center_lon: 6.1302
    half_size: 600                      # m: square of 1.2 km x 1.2 km
  demand:
    duration: 3600
    windows:                            # start times (s since midnight) of 1 h windows
      train: [25200]                    # 07:00-08:00
      eval: [28800]                     # 08:00-09:00 (disjoint vehicles)
    seeds: {train: 1001, eval: 2001}    # for thinning / duplication
    profiles:                           # multipliers applied to the real LuST demand
      low: [0.6]
      medium: [1.0]
      high: [1.3]
      peak: [0.6, 1.0, 1.5, 1.5, 1.0, 0.6]
      # Robustness study, beyond fixed-time saturation. Above x1.0 the cropped real
      # network deadlocks inside junctions once teleporting is off, so LuST uses a
      # teleport-based check instead of the drain check (docs/decisions.md D15).
      saturated: [1.5]
  validation:
    end: 7200
    max_teleport_ratio: 0.01
    profiles:                  # per-profile overrides
      saturated:               # robustness level beyond fixed-time saturation
        controller: actuated   # judged under the actuated baseline
        end: 14400
        max_teleport_ratio: 0.01   # teleporting on: <= 1 % teleports, all vehicles arrive
        gridlock_check: true       # no-teleport rerun recorded...
        gridlock_required: false   # ...but not required (junction deadlocks, D15)
