defaults: [_synthetic_defaults.yaml]
scenario:
  # Per-step std of the traffic reward term under a random policy (medium demand,
  # eval file); sets the gridlock-penalty cap (docs/decisions.md D24).
  # Regenerate: python -m trafficmarl env reward-scale grid5x5
  reward_scale: {waiting: 9.6919, queue: 0.9024, pressure: 1.0487}
  name: grid5x5
  output_dir: networks/grid/grid5x5
  network: {nx: 5, ny: 5}
  demand:
    entry_rate: 600  # knee at ~950 veh/h
    profiles:
      saturated: [1.8]   # x2.0 gridlocks permanently under actuated control (docs/decisions.md D15)
      stress: [2.0]      # robustness-only: time to gridlock and throughput, teleporting on
    robustness_only: [stress]
