# IPPO, single intersection (no neighbours, so no coordination variant), medium demand.
#   python experiments/train.py --config configs/experiments/ippo_single.yaml --seed 0 --evaluate
defaults: [base.yaml, scenarios/single.yaml, algorithms/ippo.yaml]
experiment:
  name: marl_single
  seeds: [0, 1, 2, 3, 4]
env:
  profile: medium
evaluation:
  profiles: [medium, high, peak, saturated]
