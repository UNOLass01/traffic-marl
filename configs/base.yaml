# Settings shared by every experiment. Experiment configs include this file via
#   defaults: [base.yaml, scenarios/<name>.yaml, algorithms/<name>.yaml]
# and override only what differs.
experiment:
  name: unnamed
  seeds: [0, 1, 2, 3, 4]   # at least 5 seeds per (method x scenario x demand)

logging:
  level: INFO
  tensorboard: true
  wandb: false             # W&B API key is read from the WANDB_API_KEY env var

# Simulation settings shared by every method (baselines and RL alike), so that
# all methods are compared under identical conditions (docs/decisions.md D14).
simulation:
  time_to_teleport: 300    # s; SUMO default. Teleports are counted and reported
  drain_time: 1800         # s simulated after the last insertion (fixed episode length)
  gridlock_window: 600     # s without any arrival while vehicles remain = gridlock

# Markov decision process of the learning agents (docs/mdp.md). Phase-duration
# constraints also apply to every baseline (D13).
env:
  profile: medium          # demand profile used for training and evaluation
  delta_time: 5            # s between two decisions
  min_green: 5             # s
  max_green: 50            # s
  max_red: null            # s; optional fairness constraint, off by default (D19)
  observation:
    type: local            # local | extended (adds 4 neighbour slots)
    max_distance: 200      # m of approach observed upstream of the stop line (D12)
    agent_id: false        # append a one-hot agent id (ablation; breaks transfer)
  reward:
    type: local            # local | neighborhood | global
    measure: queue         # waiting | queue | pressure (queue chosen by the reward check, D40)
    waiting_scale: 100     # s; waiting-time change is divided by this
    switch_penalty: 0.5    # subtracted when the agent changes phase (D25; ablation: 0.1, 0.5, 1.0)
    alpha: 0.5             # weight of the neighbours' mean in `neighborhood`
    gridlock_penalty: auto # terminal penalty on gridlock; auto = bound x remaining steps
    gridlock_penalty_cap_std: 100  # cap of `auto`, in per-step std of the traffic term (D24)

# Classical baselines (docs/decisions.md D28-D30).
baselines:
  webster:
    saturation_flow: measured  # veh/h per lane per movement type (D31), or one number for all
    max_cycle: 150             # s; also used when Y >= 1
    lost_time_per_phase: measured  # s per green phase: measured (D31), null = yellow time, or a number
    peak_window: 900           # s; `peak` plans use the busiest 15-minute flow, scaled to 1 h
    min_green: 5               # s, shared constraints (D13)
    max_green: 50              # s
    discharge_test:            # saturated discharge test measuring s and the lost time (D31)
      vehicles_per_lane: 40    # queued vehicles per serving lane (more than one green discharges)
      buildup_s: 300           # s of red while the queue builds
      green_s: 40              # s of green, then the scenario's yellow
      startup_s: 10            # s; crossings after this (until the end of green) give s
      clearance_s: 60          # s between tests
      min_storage_m: 150       # m of approach (up to the previous signal) needed to test a movement
      max_tests_per_type: 30   # tested movements per type (through, left, right) and scenario
  max_pressure:
    max_red: 120               # s, max-red variant of max-pressure (D32)

metrics:
  teleport_flag_threshold: 0.01   # runs above this teleport rate are flagged

device: auto               # auto | cpu | cuda; the resolved value is saved per run

torch:
  deterministic: false     # true = bit-reproducible GPU runs, slower
